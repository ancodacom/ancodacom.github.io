<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ancoda 安可达</title>
  <link rel="icon" href="/favicon.ico">

  <!-- 百度统计 -->
  <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?e9ca8e65b7bbe9f792ccb5e1e14400ab";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #e0f2fe 100%);
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 20px 45px -20px rgba(15, 23, 42, .28),
                  0 0 0 1px rgba(15, 23, 42, .04);
      animation: rise .5s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ===== Logo 区域 ===== */
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;   /* 完整显示，不裁切；如需铺满可改为 cover */
      display: block;
      border-radius: 16px;
      /* 若图片自带阴影可去掉下面这行 */
      filter: drop-shadow(0 8px 16px rgba(37, 99, 235, .22));
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .sub {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
    }

    .btn {
      display: block;
      margin-top: 26px;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 12px 22px -10px rgba(37, 99, 235, .8);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .btn:hover  { transform: translateY(-2px); box-shadow: 0 18px 28px -12px rgba(37, 99, 235, .85); }
    .btn:active { transform: translateY(0) scale(.98); filter: brightness(.95); }

    .divider {
      margin: 26px 0 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
    }

    .contact {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.9;
    }
    .contact a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed rgba(37, 99, 235, .45);
    }
    .contact a:hover { border-bottom-style: solid; }

    .contact .label {
      color: #94a3b8;
      font-weight: 400;
    }

    .wechat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #334155;
      font-weight: 600;
      background: #f1f5f9;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 13px;
      margin-left: 4px;
    }

    .tip {
      margin-top: 14px;
      font-size: 12px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>
  <div class="card">
    <!-- ===== Logo（本地图片） ===== -->
    <div class="logo">
      <img src="/images/logo.png" alt="Ancoda 安可达">
    </div>

    <h1>Ancoda 安可达</h1>
    <p class="sub">点击下方按钮进入官网</p>

    <!-- 关键：点击后才跳转 -->
    <a class="btn" href="https://www.ancoda.com.cn" rel="noopener">进入官网 →</a>

    <div class="divider"></div>

    <p class="contact">
      <span class="label">邮箱：</span>
      <a href="mailto:service@ancoda.com.cn">service@ancoda.com.cn</a>
      <br>
      <span class="label">微信：</span>
      <span class="wechat">myancoda</span>
    </p>
    <p class="tip">点击按钮后将跳转至 www.ancoda.com.cn</p>
  </div>
</body>
</html>
